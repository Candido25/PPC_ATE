<!DOCTYPE html>
<html lang="es-PE">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, follow">
  <meta name="theme-color" content="#0d5b2d">
  <title>Página no encontrada | PPC Ate</title>
  <link rel="icon" href="assets/favicon-ppc.png" type="image/png">
  <link rel="stylesheet" href="styles.css">
  <style>
    body{min-height:100vh;display:grid;place-items:center;background:#f4f8f4;margin:0;color:#1f2b22;font-family:Arial,sans-serif}
    main{width:min(92%,720px);text-align:center;background:#fff;border:1px solid #dce7df;border-radius:24px;padding:48px 28px;box-shadow:0 18px 50px rgba(13,91,45,.12)}
    .code{font-size:clamp(4rem,14vw,8rem);font-weight:900;line-height:1;color:#0d5b2d;margin:0}
    h1{margin:10px 0 12px;font-size:clamp(1.6rem,4vw,2.4rem)}
    p{color:#5e6d62;line-height:1.7;max-width:560px;margin:0 auto 24px}
    a{display:inline-flex;align-items:center;justify-content:center;padding:13px 22px;border-radius:999px;background:#0d5b2d;color:#fff;text-decoration:none;font-weight:800}
    a:focus-visible{outline:3px solid #d7b23f;outline-offset:4px}
  </style>
</head>
<body>
  <main>
    <p class="code" aria-hidden="true">404</p>
    <h1>Esta página no existe o fue trasladada</h1>
    <p>El enlace puede estar desactualizado. Regresa al portal oficial del PPC Ate para consultar propuestas, diagnósticos, actividades y el buzón de fiscalización ciudadana.</p>
    <a href="/">Volver a la página principal</a>
  </main>
</body>
</html>
